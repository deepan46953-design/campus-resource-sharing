<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | CampusShare</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-entry"><nav class="site-nav"><a class="brand" href="/"><img src="logo.svg" alt="CampusShare logo" class="brand-logo"><span>Campus<span class="brand-accent">Share</span></span></a><div id="nav"></div></nav><main class="form-page"><div class="box"><h1>Join CampusShare</h1><p class="form-subtitle">Create your student account to share and discover campus resources.</p><form id="registerForm"><div class="form-grid"><div class="field"><label>Full name</label><input id="name" placeholder="Your name" required></div><div class="field"><label>Roll number</label><input id="roll" placeholder="e.g. 24CS001" required></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="student@example.com" required></div><div class="field"><label>Phone</label><input id="phone" placeholder="Mobile number" required></div><div class="field"><label>Department</label><input id="department" placeholder="e.g. CSBS" required></div><div class="field"><label>Year</label><select id="year" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div><div class="field full"><label>Password</label><input id="password" type="password" minlength="6" placeholder="At least 6 characters" required></div></div><button class="btn" style="margin-top:20px;width:100%">Create Account</button></form><p id="msg" class="message"></p><p class="muted" style="font-size:13px">Already registered? <a href="login.html" style="color:#315bdc;font-weight:700">Login here</a></p></div></main><script type="module" src="js/auth.js"></script><script type="module" src="js/nav.js"></script></body></html>
