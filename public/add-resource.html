<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Resource | CampusShare</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="site-nav"><a class="brand" href="/"><img src="logo.svg" alt="CampusShare logo" class="brand-logo"><span>Campus<span class="brand-accent">Share</span></span></a><div id="nav"></div></nav><main class="form-page"><div class="box"><h1>Share a Resource</h1><p class="form-subtitle">Add a real book, note, calculator, lab item or other academic resource.</p><div class="notice">💡 Be clear about the condition and pickup location so other students can contact you easily.</div><form id="resourceForm"><div class="form-grid"><div class="field full"><label>Resource title</label><input id="title" placeholder="e.g. Engineering Mathematics textbook" required></div><div class="field"><label>Category</label><input id="category" placeholder="Books / Notes / Equipment" required></div><div class="field"><label>Lend or Sell</label><select id="listingType" required><option value="">Choose type</option><option value="lend">Lend</option><option value="sell">Sell</option></select></div><div class="field"><label>Condition</label><input id="condition" placeholder="New / Good / Used" required></div><div class="field"><label>Price (₹)</label><input id="price" type="number" min="0" value="0" disabled></div><div class="field full"><label>Pickup location</label><input id="location" placeholder="e.g. Block A, Library, Hostel 2" required></div><div class="field full"><label>Description</label><textarea id="description" placeholder="Add useful details about the resource..." required></textarea></div><div class="field"><label>Contact phone</label><input id="contactPhone" placeholder="Phone number"></div><div class="field"><label>Contact email</label><input id="contactEmail" type="email" placeholder="Email address"></div><div class="field full"><label class="check"><input id="showContact" type="checkbox" checked> Show my contact details to interested students</label></div></div><div class="form-actions"><a class="btn outline" href="resources.html">Cancel</a><button class="btn">Publish Resource</button></div></form><p id="msg" class="message"></p></div></main><script type="module" src="js/add-resource.js"></script><script type="module" src="js/nav.js"></script></body></html>
